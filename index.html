<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Tools Database</title>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a buyer's spec sheet. Three views (Browse, Help me choose, Shortlist) under one sticky bar; tool cards grouped by category. */
:root {
  --bg: #f3f5f7;
  --surface: #ffffff;
  --fg: #17212b;
  --muted: #5b6875;
  --line: #d9dfe5;
  --accent: #1b5e8c;
  --accent-soft: #e2edf5;
  --on-accent: #ffffff;
  --gold: #8a5a00;
  --gold-soft: #fbefd5;
  --good: #1f7a4d;
  --warn: #9a6200;
  --bad: #b3261e;
  --chip: #e9edf1;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11171d; --surface: #182129; --fg: #e4eaf0; --muted: #98a6b3; --line: #2a3640;
    --accent: #7db8e3; --accent-soft: #1c3346; --on-accent: #0d1720; --gold: #f0c46a; --gold-soft: #3a2e14;
    --good: #6fcf9a; --warn: #e3b25a; --bad: #f08a80; --chip: #222d37;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11171d; --surface: #182129; --fg: #e4eaf0; --muted: #98a6b3; --line: #2a3640;
  --accent: #7db8e3; --accent-soft: #1c3346; --on-accent: #0d1720; --gold: #f0c46a; --gold-soft: #3a2e14;
  --good: #6fcf9a; --warn: #e3b25a; --bad: #f08a80; --chip: #222d37;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--font-body); margin: 0; }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 64px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
h1 { font-size: clamp(1.9rem, 4vw, 2.8rem); font-weight: 800; letter-spacing: -0.02em; line-height: 1.05; }
h2 { font-size: 1.45rem; font-weight: 800; letter-spacing: -0.01em; }
h3 { font-size: 1.08rem; font-weight: 600; }
a { color: var(--accent); }
.lede { color: var(--muted); max-width: 68ch; margin: 10px 0 0; }
.meta { font: 12px/1.4 var(--font-mono); color: var(--muted); letter-spacing: 0.02em; margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px 16px; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 12px; border-bottom: 1px solid var(--line); margin-top: 20px; display: grid; gap: 10px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-top: 20px; overflow-x: auto; }
.tab { font: 600 14px var(--font-body); padding: 10px 14px; border: 0; border-bottom: 3px solid transparent; background: none; color: var(--muted); cursor: pointer; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.tab .n { font: 500 11px var(--font-mono); background: var(--accent); color: var(--on-accent); border-radius: 999px; padding: 2px 7px; margin-left: 4px; }
.search { flex: 1 1 260px; min-width: 0; font: inherit; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--fg); }
:is(.search, button, select, input):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
select { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--fg); }
.chip { font: 500 13px/1 var(--font-body); padding: 8px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.cats { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
.cats .chip { flex: none; }
.toggle { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); cursor: pointer; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { font: 500 13px/1 var(--font-mono); padding: 8px 10px; border: 0; background: var(--surface); color: var(--fg); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.count { font: 12px var(--font-mono); color: var(--muted); margin-left: auto; }

section.cat { margin-top: 36px; scroll-margin-top: 200px; }
.cat-head { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; margin-bottom: 14px; }
.cat-head p { margin: 0; color: var(--muted); font-size: 14px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card.picked { border-color: var(--gold); }
.card.gone { opacity: 0.72; }
.award { align-self: flex-start; font: 600 11px/1 var(--font-mono); letter-spacing: 0.04em; text-transform: uppercase; color: var(--gold); background: var(--gold-soft); padding: 5px 8px; border-radius: 4px; }
.card-top { display: flex; justify-content: space-between; gap: 10px; align-items: start; }
.card-top h3 a { color: var(--fg); text-decoration: none; }
.card-top h3 a:hover { text-decoration: underline; }
.maker { font-size: 12px; color: var(--muted); }
.price { text-align: right; flex: none; }
.price b { font: 500 1.15rem/1.1 var(--font-mono); font-variant-numeric: tabular-nums; display: block; }
.price span { font: 11px var(--font-mono); color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.best { font-weight: 500; margin: 0; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { font: 500 11px/1 var(--font-mono); padding: 5px 8px; border-radius: 999px; background: var(--chip); color: var(--muted); letter-spacing: 0.03em; }
.pill.free { background: var(--accent-soft); color: var(--accent); }
.pill.paused, .pill.old, .pill.soon { color: var(--warn); }
.pill.gone { color: var(--bad); }
dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 4px 10px; font-size: 13.5px; }
dt { color: var(--muted); font: 11px/1.9 var(--font-mono); text-transform: uppercase; letter-spacing: 0.06em; }
dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.scores { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.score { display: grid; gap: 3px; }
.score span { font: 10px var(--font-mono); color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.meter { height: 5px; border-radius: 3px; background: var(--chip); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); }
.overall { font: 500 12px var(--font-mono); color: var(--muted); }
.overall b { color: var(--fg); font-size: 14px; }
.card-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: auto; }
details summary { cursor: pointer; font-size: 13px; color: var(--accent); }
details[open] summary { margin-bottom: 8px; }
.add { font: 500 12px var(--font-body); padding: 6px 10px; border-radius: 6px; border: 1px solid var(--accent); background: var(--surface); color: var(--accent); cursor: pointer; white-space: nowrap; }
.add[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: grid; gap: 16px; margin-top: 22px; }
.q { display: grid; gap: 8px; }
.q > span { font-weight: 600; }
.results { display: grid; gap: 10px; margin-top: 20px; }
.result { display: grid; grid-template-columns: 2.2em 1fr auto; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.result .rank { font: 800 1.4rem var(--font-display); color: var(--muted); }
.result p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
.result > div { min-width: 0; }
.hint { color: var(--muted); font-size: 14px; margin: 0; }

.matrix-wrap { overflow-x: auto; margin-bottom: 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: center; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; position: sticky; left: 0; background: var(--surface); }
thead th { font: 500 11px var(--font-mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
tbody tr:last-child td { border-bottom: 0; }
.cmp td, .cmp th { white-space: normal; text-align: left; vertical-align: top; min-width: 200px; }
.cmp td:first-child, .cmp th:first-child { min-width: 110px; font: 500 11px var(--font-mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.m-star { color: var(--accent); font-weight: 600; }
.m-yes { color: var(--good); }
.m-partial { color: var(--warn); }
.m-no { color: var(--muted); }
.legend { font-size: 12px; color: var(--muted); margin: -6px 0 16px; }
.total { display: flex; flex-wrap: wrap; gap: 8px 28px; align-items: baseline; }
.total b { font: 500 1.8rem var(--font-mono); font-variant-numeric: tabular-nums; }
.total span { color: var(--muted); font-size: 13px; }
.empty { padding: 40px 0; color: var(--muted); text-align: center; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); font: inherit; cursor: pointer; text-decoration: underline; }
footer { margin-top: 48px; padding-top: 18px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
@media (max-width: 520px) { .scores { grid-template-columns: repeat(2, 1fr); } .result { grid-template-columns: 1.6em 1fr; } .result .add { grid-column: 2; justify-self: start; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <h1>AI Tools Database</h1>
    <p class="lede">Every major consumer AI tool in one place: what it costs (with Australian prices), what it's good at, what to watch out for, and how it treats your data.</p>
    <div class="meta" id="meta"></div>
  </header>

  <div class="tabs" role="tablist" aria-label="Views">
    <button class="tab" role="tab" id="tab-browse" data-view="browse" aria-selected="true">Browse all</button>
    <button class="tab" role="tab" id="tab-choose" data-view="choose" aria-selected="false">Help me choose</button>
    <button class="tab" role="tab" id="tab-list" data-view="list" aria-selected="false">My shortlist<span class="n" id="list-n" hidden></span></button>
  </div>

  <div id="view-browse">
    <div class="bar">
      <div class="row">
        <input id="q" class="search" type="search" placeholder="Search tools, makers or uses (e.g. music, privacy, Excel)" aria-label="Search tools">
        <select id="sort" aria-label="Sort">
          <option value="default">Sort: editor's order</option>
          <option value="rating">Sort: highest rated</option>
          <option value="price">Sort: cheapest first</option>
          <option value="privacy">Sort: most private</option>
          <option value="name">Sort: name A–Z</option>
        </select>
        <div class="seg" role="group" aria-label="Currency">
          <button id="cur-usd" type="button" aria-pressed="true">US$</button>
          <button id="cur-aud" type="button" aria-pressed="false">A$</button>
        </div>
      </div>
      <div class="row cats" id="cats" role="group" aria-label="Category"></div>
      <div class="row">
        <label class="toggle"><input id="free" type="checkbox"> Free tier</label>
        <label class="toggle"><input id="picks" type="checkbox"> Top picks only</label>
        <label class="toggle"><input id="hide-gone" type="checkbox" checked> Hide discontinued</label>
        <span class="count" id="count"></span>
      </div>
    </div>
    <main id="out"></main>
  </div>

  <div id="view-choose" hidden>
    <form class="panel" id="picker">
      <div class="q"><span>What do you want to do?</span><div class="row" id="needs"></div></div>
      <div class="q"><span>Monthly budget per tool</span>
        <div class="seg" role="group" aria-label="Budget" id="budget">
          <button type="button" data-b="0">Free</button>
          <button type="button" data-b="10">Up to $10</button>
          <button type="button" data-b="25" aria-pressed="true">Up to $25</button>
          <button type="button" data-b="1e9">Any</button>
        </div>
      </div>
      <div class="q"><span>Anything else?</span>
        <div class="row">
          <label class="toggle"><input id="p-priv" type="checkbox"> Privacy matters a lot to me</label>
          <label class="toggle"><input id="p-easy" type="checkbox"> Keep it simple</label>
          <select id="p-eco" aria-label="Devices you use">
            <option value="">I use a mix of devices</option>
            <option value="apple">Mostly Apple</option>
            <option value="google">Mostly Google / Android</option>
            <option value="microsoft">Mostly Windows / Office</option>
          </select>
        </div>
      </div>
    </form>
    <div class="results" id="results"></div>
  </div>

  <div id="view-list" hidden>
    <div id="list-out"></div>
  </div>

  <footer id="foot"></footer>
</div>

const live = DATA.tools.filter(t => t.status !== "discontinued");
$("meta").innerHTML = `<span>Updated ${esc(DATA.asOf)}</span><span>${DATA.tools.length} tools · ${DATA.categories.length} categories</span><span>${live.filter(t => t.free).length} with a free tier</span><span>US$ · A$ published or ≈ ×${DATA.rate} + GST</span>`;
$("cats").innerHTML = `<button class="chip" type="button" data-cat="all">All</button>` +
  DATA.categories.map(c => `<button class="chip" type="button" data-cat="${c.id}">${esc(c.name)}</button>`).join("");
$("cats").addEventListener("click", e => { const b = e.target.closest(".chip"); if (b) { state.cat = b.dataset.cat; renderBrowse(); } });
$("q").addEventListener("input", e => { state.q = e.target.value.trim(); renderBrowse(); });
$("sort").addEventListener("change", e => { state.sort = e.target.value; renderBrowse(); });
$("free").addEventListener("change", e => { state.free = e.target.checked; renderBrowse(); });
$("picks").addEventListener("change", e => { state.picks = e.target.checked; renderBrowse(); });
$("hide-gone").addEventListener("change", e => { state.hideGone = e.target.checked; renderBrowse(); });
$("cur-usd").addEventListener("click", () => setCur("usd"));
$("cur-aud").addEventListener("click", () => setCur("aud"));
$("foot").innerHTML = `Prices are individual plans in US dollars per month unless marked /yr or "once". A$ prices are published Australian prices where shown; otherwise ≈ estimates at US$1 = A$${DATA.rate} plus 10% GST. App-store prices often differ. Ratings are this guide's judgement: quality counts double, then value, ease and privacy. "Unverified" rows weren't re-checked in this update. AI plans change monthly, so check the maker's site before paying.`;
const hash = location.hash.slice(1);
if (["choose", "list"].includes(hash)) state.view = hash;
else if (DATA.categories.some(c => c.id === hash)) state.cat = hash;
render();
</script>

</body>
</html>
