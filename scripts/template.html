<title>AI Tools Database</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a buyer's spec sheet. Three views (Browse, Help me choose, Shortlist) under one sticky bar; tool cards grouped by category. */
:root {
  --bg: #f3f5f7;
  --surface: #ffffff;
  --fg: #17212b;
  --muted: #5b6875;
  --line: #d9dfe5;
  --accent: #1b5e8c;
  --accent-soft: #e2edf5;
  --on-accent: #ffffff;
  --gold: #8a5a00;
  --gold-soft: #fbefd5;
  --good: #1f7a4d;
  --warn: #9a6200;
  --bad: #b3261e;
  --chip: #e9edf1;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11171d; --surface: #182129; --fg: #e4eaf0; --muted: #98a6b3; --line: #2a3640;
    --accent: #7db8e3; --accent-soft: #1c3346; --on-accent: #0d1720; --gold: #f0c46a; --gold-soft: #3a2e14;
    --good: #6fcf9a; --warn: #e3b25a; --bad: #f08a80; --chip: #222d37;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11171d; --surface: #182129; --fg: #e4eaf0; --muted: #98a6b3; --line: #2a3640;
  --accent: #7db8e3; --accent-soft: #1c3346; --on-accent: #0d1720; --gold: #f0c46a; --gold-soft: #3a2e14;
  --good: #6fcf9a; --warn: #e3b25a; --bad: #f08a80; --chip: #222d37;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--font-body); margin: 0; }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 64px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
h1 { font-size: clamp(1.9rem, 4vw, 2.8rem); font-weight: 800; letter-spacing: -0.02em; line-height: 1.05; }
h2 { font-size: 1.45rem; font-weight: 800; letter-spacing: -0.01em; }
h3 { font-size: 1.08rem; font-weight: 600; }
a { color: var(--accent); }
.lede { color: var(--muted); max-width: 68ch; margin: 10px 0 0; }
.meta { font: 12px/1.4 var(--font-mono); color: var(--muted); letter-spacing: 0.02em; margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px 16px; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 12px; border-bottom: 1px solid var(--line); margin-top: 20px; display: grid; gap: 10px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-top: 20px; overflow-x: auto; }
.tab { font: 600 14px var(--font-body); padding: 10px 14px; border: 0; border-bottom: 3px solid transparent; background: none; color: var(--muted); cursor: pointer; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.tab .n { font: 500 11px var(--font-mono); background: var(--accent); color: var(--on-accent); border-radius: 999px; padding: 2px 7px; margin-left: 4px; }
.search { flex: 1 1 260px; min-width: 0; font: inherit; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--fg); }
:is(.search, button, select, input):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
select { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--fg); }
.chip { font: 500 13px/1 var(--font-body); padding: 8px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.cats { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
.cats .chip { flex: none; }
.toggle { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); cursor: pointer; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { font: 500 13px/1 var(--font-mono); padding: 8px 10px; border: 0; background: var(--surface); color: var(--fg); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.count { font: 12px var(--font-mono); color: var(--muted); margin-left: auto; }

section.cat { margin-top: 36px; scroll-margin-top: 200px; }
.cat-head { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; margin-bottom: 14px; }
.cat-head p { margin: 0; color: var(--muted); font-size: 14px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card.picked { border-color: var(--gold); }
.card.gone { opacity: 0.72; }
.award { align-self: flex-start; font: 600 11px/1 var(--font-mono); letter-spacing: 0.04em; text-transform: uppercase; color: var(--gold); background: var(--gold-soft); padding: 5px 8px; border-radius: 4px; }
.card-top { display: flex; justify-content: space-between; gap: 10px; align-items: start; }
.card-top h3 a { color: var(--fg); text-decoration: none; }
.card-top h3 a:hover { text-decoration: underline; }
.maker { font-size: 12px; color: var(--muted); }
.price { text-align: right; flex: none; }
.price b { font: 500 1.15rem/1.1 var(--font-mono); font-variant-numeric: tabular-nums; display: block; }
.price span { font: 11px var(--font-mono); color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.best { font-weight: 500; margin: 0; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { font: 500 11px/1 var(--font-mono); padding: 5px 8px; border-radius: 999px; background: var(--chip); color: var(--muted); letter-spacing: 0.03em; }
.pill.free { background: var(--accent-soft); color: var(--accent); }
.pill.paused, .pill.old, .pill.soon { color: var(--warn); }
.pill.gone { color: var(--bad); }
dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 4px 10px; font-size: 13.5px; }
dt { color: var(--muted); font: 11px/1.9 var(--font-mono); text-transform: uppercase; letter-spacing: 0.06em; }
dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.scores { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.score { display: grid; gap: 3px; }
.score span { font: 10px var(--font-mono); color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.meter { height: 5px; border-radius: 3px; background: var(--chip); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); }
.overall { font: 500 12px var(--font-mono); color: var(--muted); }
.overall b { color: var(--fg); font-size: 14px; }
.card-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: auto; }
details summary { cursor: pointer; font-size: 13px; color: var(--accent); }
details[open] summary { margin-bottom: 8px; }
.add { font: 500 12px var(--font-body); padding: 6px 10px; border-radius: 6px; border: 1px solid var(--accent); background: var(--surface); color: var(--accent); cursor: pointer; white-space: nowrap; }
.add[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: grid; gap: 16px; margin-top: 22px; }
.q { display: grid; gap: 8px; }
.q > span { font-weight: 600; }
.results { display: grid; gap: 10px; margin-top: 20px; }
.result { display: grid; grid-template-columns: 2.2em 1fr auto; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.result .rank { font: 800 1.4rem var(--font-display); color: var(--muted); }
.result p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
.result > div { min-width: 0; }
.hint { color: var(--muted); font-size: 14px; margin: 0; }

.matrix-wrap { overflow-x: auto; margin-bottom: 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: center; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; position: sticky; left: 0; background: var(--surface); }
thead th { font: 500 11px var(--font-mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
tbody tr:last-child td { border-bottom: 0; }
.cmp td, .cmp th { white-space: normal; text-align: left; vertical-align: top; min-width: 200px; }
.cmp td:first-child, .cmp th:first-child { min-width: 110px; font: 500 11px var(--font-mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.m-star { color: var(--accent); font-weight: 600; }
.m-yes { color: var(--good); }
.m-partial { color: var(--warn); }
.m-no { color: var(--muted); }
.legend { font-size: 12px; color: var(--muted); margin: -6px 0 16px; }
.total { display: flex; flex-wrap: wrap; gap: 8px 28px; align-items: baseline; }
.total b { font: 500 1.8rem var(--font-mono); font-variant-numeric: tabular-nums; }
.total span { color: var(--muted); font-size: 13px; }
.empty { padding: 40px 0; color: var(--muted); text-align: center; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); font: inherit; cursor: pointer; text-decoration: underline; }
footer { margin-top: 48px; padding-top: 18px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
@media (max-width: 520px) { .scores { grid-template-columns: repeat(2, 1fr); } .result { grid-template-columns: 1.6em 1fr; } .result .add { grid-column: 2; justify-self: start; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <h1>AI Tools Database</h1>
    <p class="lede">Every major consumer AI tool in one place: what it costs (with Australian prices), what it's good at, what to watch out for, and how it treats your data.</p>
    <div class="meta" id="meta"></div>
  </header>

  <div class="tabs" role="tablist" aria-label="Views">
    <button class="tab" role="tab" id="tab-browse" data-view="browse" aria-selected="true">Browse all</button>
    <button class="tab" role="tab" id="tab-choose" data-view="choose" aria-selected="false">Help me choose</button>
    <button class="tab" role="tab" id="tab-list" data-view="list" aria-selected="false">My shortlist<span class="n" id="list-n" hidden></span></button>
  </div>

  <div id="view-browse">
    <div class="bar">
      <div class="row">
        <input id="q" class="search" type="search" placeholder="Search tools, makers or uses (e.g. music, privacy, Excel)" aria-label="Search tools">
        <select id="sort" aria-label="Sort">
          <option value="default">Sort: editor's order</option>
          <option value="rating">Sort: highest rated</option>
          <option value="price">Sort: cheapest first</option>
          <option value="privacy">Sort: most private</option>
          <option value="name">Sort: name A–Z</option>
        </select>
        <div class="seg" role="group" aria-label="Currency">
          <button id="cur-usd" type="button" aria-pressed="true">US$</button>
          <button id="cur-aud" type="button" aria-pressed="false">A$</button>
        </div>
      </div>
      <div class="row cats" id="cats" role="group" aria-label="Category"></div>
      <div class="row">
        <label class="toggle"><input id="free" type="checkbox"> Free tier</label>
        <label class="toggle"><input id="picks" type="checkbox"> Top picks only</label>
        <label class="toggle"><input id="hide-gone" type="checkbox" checked> Hide discontinued</label>
        <span class="count" id="count"></span>
      </div>
    </div>
    <main id="out"></main>
  </div>

  <div id="view-choose" hidden>
    <form class="panel" id="picker">
      <div class="q"><span>What do you want to do?</span><div class="row" id="needs"></div></div>
      <div class="q"><span>Monthly budget per tool</span>
        <div class="seg" role="group" aria-label="Budget" id="budget">
          <button type="button" data-b="0">Free</button>
          <button type="button" data-b="10">Up to $10</button>
          <button type="button" data-b="25" aria-pressed="true">Up to $25</button>
          <button type="button" data-b="1e9">Any</button>
        </div>
      </div>
      <div class="q"><span>Anything else?</span>
        <div class="row">
          <label class="toggle"><input id="p-priv" type="checkbox"> Privacy matters a lot to me</label>
          <label class="toggle"><input id="p-easy" type="checkbox"> Keep it simple</label>
          <select id="p-eco" aria-label="Devices you use">
            <option value="">I use a mix of devices</option>
            <option value="apple">Mostly Apple</option>
            <option value="google">Mostly Google / Android</option>
            <option value="microsoft">Mostly Windows / Office</option>
          </select>
        </div>
      </div>
    </form>
    <div class="results" id="results"></div>
  </div>

  <div id="view-list" hidden>
    <div id="list-out"></div>
  </div>

  <footer id="foot"></footer>
</div>

<script>
const DATA = /*__DATA__*/null;
const FEATS = ["search","research","image","video","voice","code","files","memory","agent"];
const MARK = {star:"★", yes:"✓", partial:"~", no:"✗"};
const SCORE_KEYS = ["quality","value","ease","privacy"];
const NEEDS = [
  ["chat","Everyday questions"], ["writing","Writing"], ["research","Research"], ["study","Study / homework"],
  ["images","Make images"], ["photos","Edit photos"], ["video","Make video"], ["music","Music"], ["voice","Voice & dictation"],
  ["slides","Slides & documents"], ["meetings","Meeting notes"], ["coding","Coding"], ["apps","Build an app"],
  ["agents","Hand off tasks"], ["translation","Translation"], ["languages","Learn a language"], ["office","Work in Office"],
  ["browser","Browse the web"], ["local","Run AI offline"]
];
const ECO = {apple: ["apple"], google: ["google"], microsoft: ["microsoft", "office"]};
const state = {view:"browse", q:"", cat:"all", free:false, picks:false, hideGone:true, sort:"default", cur:"usd",
  needs:new Set(["chat"]), budget:25, priv:false, easy:false, eco:"", list:[]};
try {
  const s = JSON.parse(localStorage.getItem("aidb-prefs") || "{}");
  if (s.cur) state.cur = s.cur;
  if (Array.isArray(s.list)) state.list = s.list.filter(id => DATA.tools.some(t => t.id === id));
} catch (e) {}
const save = () => { try { localStorage.setItem("aidb-prefs", JSON.stringify({cur: state.cur, list: state.list})); } catch (e) {} };

const $ = id => document.getElementById(id);
const byId = Object.fromEntries(DATA.tools.map(t => [t.id, t]));
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const SUFFIX = {monthly: "/mo", yearly: "/yr", "one-off": " once"};
const overall = t => Math.round((t.scores.quality * 2 + t.scores.value + t.scores.ease + t.scores.privacy) / 5 * 10) / 10;
const monthly = t => t.from == null ? 0 : t.billing === "yearly" ? t.from / 12 : t.billing === "one-off" ? 0 : t.from;
function money(v, cur = state.cur) {
  if (v == null) return null;
  if (cur === "aud") return "A$" + Math.round(v * DATA.rate * DATA.gst).toLocaleString();
  return "$" + (Number.isInteger(v) ? v.toLocaleString() : v.toFixed(2));
}
function priceBlock(t) {
  if (t.status === "discontinued") return `<b>—</b><span>closed</span>`;
  if (t.status === "upcoming" && t.from == null) return `<b>TBA</b><span>coming soon</span>`;
  if (t.from == null) return `<b>${t.free ? "Free" : "Per use"}</b><span>${t.free ? "no paid plan" : "pay as you go"}</span>`;
  const shown = state.cur === "aud" ? (t.aud_from != null ? "A$" + t.aud_from : "≈ " + money(t.from)) : money(t.from);
  return `<b>${shown}</b><span>${t.free ? "free · " : ""}from ${SUFFIX[t.billing]}</span>`;
}
function matches(t) {
  if (state.cat !== "all" && t.category !== state.cat) return false;
  if (state.free && !t.free) return false;
  if (state.picks && !t.pick) return false;
  if (state.hideGone && t.status === "discontinued") return false;
  if (!state.q) return true;
  const hay = [t.name, t.maker, t.best_for, t.strengths, t.watch_out, t.pricing, t.platforms, t.privacy, t.region, t.tags.join(" "), t.pick].join(" ").toLowerCase();
  return state.q.toLowerCase().split(/\s+/).every(w => hay.includes(w));
}
const inList = id => state.list.includes(id);
function addBtn(t) {
  if (t.status === "discontinued") return "";
  const on = inList(t.id);
  return `<button class="add" type="button" data-add="${t.id}" aria-pressed="${on}">${on ? "✓ Shortlisted" : "+ Shortlist"}</button>`;
}
function scoresBlock(t) {
  return `<div class="scores">${SCORE_KEYS.map(k => `<div class="score" title="${k}: ${t.scores[k]} of 5"><span>${k}</span><div class="meter"><i style="width:${t.scores[k] * 20}%"></i></div></div>`).join("")}</div>`;
}
function card(t) {
  const pills = [];
  if (t.free) pills.push(`<span class="pill free">Free tier</span>`);
  if (t.status === "paused") pills.push(`<span class="pill paused">Sign-ups paused</span>`);
  if (t.status === "upcoming") pills.push(`<span class="pill soon">Coming soon</span>`);
  if (t.status === "discontinued") pills.push(`<span class="pill gone">Discontinued</span>`);
  if (t.region && t.region !== "—") pills.push(`<span class="pill">Data: ${esc(t.region)}</span>`);
  pills.push(t.verified === "older" ? `<span class="pill old">Unverified</span>` : `<span class="pill">Checked ${esc(t.verified)}</span>`);
  const live = t.status !== "discontinued";
  return `<article class="card${t.pick ? " picked" : ""}${live ? "" : " gone"}">
    ${t.pick ? `<span class="award">★ ${esc(t.pick)}</span>` : ""}
    <div class="card-top">
      <div><h3><a href="${esc(t.url)}" target="_blank" rel="noopener">${esc(t.name)}</a></h3><div class="maker">${esc(t.maker)}</div></div>
      <div class="price">${priceBlock(t)}</div>
    </div>
    <p class="best">${esc(t.best_for)}</p>
    <div class="pills">${pills.join("")}</div>
    <dl>
      <dt>Plans</dt><dd>${esc(t.pricing)}</dd>
      ${t.aud ? `<dt>In A$</dt><dd>${esc(t.aud)}</dd>` : ""}
      ${t.au ? `<dt>In AU</dt><dd>${esc(t.au)}</dd>` : ""}
      ${t.free && t.free_note ? `<dt>Free</dt><dd>${esc(t.free_note)}</dd>` : ""}
      <dt>Watch</dt><dd>${esc(t.watch_out)}</dd>
    </dl>
    ${live ? scoresBlock(t) : ""}
    ${t.strengths !== "—" ? `<details><summary>Strengths, platforms, privacy</summary><dl>
      <dt>Good at</dt><dd>${esc(t.strengths)}</dd>
      <dt>Runs on</dt><dd>${esc(t.platforms)}</dd>
      <dt>Privacy</dt><dd>${esc(t.privacy)}</dd>
      <dt>Sources</dt><dd>${t.sources.map((s, i) => `<a href="${esc(s)}" target="_blank" rel="noopener">${i + 1}</a>`).join(" · ")}</dd>
    </dl></details>` : ""}
    <div class="card-foot">${live ? `<span class="overall">Rating <b>${overall(t)}</b>/5</span>` : "<span></span>"}${addBtn(t)}</div>
  </article>`;
}
function matrix(list) {
  const rows = list.filter(t => t.features);
  if (!rows.length) return "";
  return `<div class="matrix-wrap"><table><thead><tr><th>Assistant</th>${FEATS.map(f => `<th>${f}</th>`).join("")}<th>From</th></tr></thead><tbody>
    ${rows.map(t => `<tr><td>${esc(t.name)}</td>${FEATS.map(f => `<td class="m-${t.features[f]}" title="${t.features[f]}">${MARK[t.features[f]]}</td>`).join("")}<td>${t.from == null ? "Free" : money(t.from)}</td></tr>`).join("")}
  </tbody></table></div><p class="legend">★ standout · ✓ yes · ~ limited · ✗ no. Agent = carries out multi-step tasks for you.</p>`;
}
function sorted(list) {
  const price = t => t.from == null ? (t.free ? 0 : 1e9) : monthly(t) || t.from;
  const by = {
    name: (a, b) => a.name.localeCompare(b.name),
    price: (a, b) => price(a) - price(b),
    rating: (a, b) => overall(b) - overall(a),
    privacy: (a, b) => b.scores.privacy - a.scores.privacy || overall(b) - overall(a),
  }[state.sort];
  return by ? [...list].sort(by) : list;
}
function renderBrowse() {
  const shown = DATA.tools.filter(matches);
  $("count").textContent = `${shown.length} of ${DATA.tools.length} tools`;
  const html = DATA.categories.map(c => {
    const list = sorted(shown.filter(t => t.category === c.id));
    if (!list.length) return "";
    return `<section class="cat" id="${c.id}"><div class="cat-head"><h2>${esc(c.name)}</h2><p>${esc(c.blurb)}</p></div>
      ${c.id === "assistant" ? matrix(list) : ""}<div class="grid">${list.map(card).join("")}</div></section>`;
  }).join("");
  $("out").innerHTML = html || `<p class="empty">No tools match. Try a shorter search or clear the filters.</p>`;
  document.querySelectorAll("#cats .chip").forEach(b => b.setAttribute("aria-pressed", b.dataset.cat === state.cat));
}

function recommend() {
  const needs = [...state.needs];
  const eco = ECO[state.eco] || [];
  return DATA.tools
    .filter(t => t.status === "active" || t.status === "paused")
    .filter(t => {
      if (state.budget === 0) return t.free;
      if (t.billing === "one-off") return state.budget > 1e8;
      return t.free || t.from == null || monthly(t) <= state.budget;
    })
    .map(t => {
      const hits = needs.filter(n => t.tags.includes(n));
      if (!hits.length) return null;
      let s = hits.length * 3 + overall(t) + (t.pick ? 1 : 0);
      if (state.priv) s += (t.scores.privacy - 3) * 1.5;
      if (state.easy) s += (t.scores.ease - 3);
      if (eco.some(e => t.tags.includes(e))) s += 1.5;
      const otherEco = ["apple", "google", "microsoft"].filter(e => !eco.includes(e));
      if (state.eco && otherEco.some(e => t.tags.includes(e)) && !eco.some(e => t.tags.includes(e))) s -= 1.5;
      if (t.status === "paused") s -= 2;
      return {t, s, hits};
    })
    .filter(Boolean)
    .sort((a, b) => b.s - a.s)
    .slice(0, 8);
}
function renderChoose() {
  $("needs").innerHTML = NEEDS.map(([k, label]) => `<button type="button" class="chip" data-need="${k}" aria-pressed="${state.needs.has(k)}">${label}</button>`).join("");
  document.querySelectorAll("#budget button").forEach(b => b.setAttribute("aria-pressed", Number(b.dataset.b) === state.budget));
  if (!state.needs.size) { $("results").innerHTML = `<p class="hint">Pick at least one thing you want to do.</p>`; return; }
  const recs = recommend();
  const label = Object.fromEntries(NEEDS);
  $("results").innerHTML = recs.length ? `<p class="hint">Best matches for you, ranked by fit, rating and your preferences.</p>` + recs.map((r, i) => {
    const t = r.t;
    const price = t.from == null ? (t.free ? "Free" : "Pay per use") : `${t.free ? "Free, or " : ""}${money(t.from)}${SUFFIX[t.billing]}`;
    return `<div class="result"><div class="rank">${i + 1}</div><div>
      <strong>${esc(t.name)}</strong> <span class="maker">· ${esc(t.maker)} · ${price} · rated ${overall(t)}/5</span>
      <p>${esc(t.best_for)}. Good for: ${r.hits.map(h => label[h]).join(", ")}.${t.pick ? ` ★ ${esc(t.pick)}.` : ""}</p>
      <p>Watch: ${esc(t.watch_out)}</p></div>${addBtn(t)}</div>`;
  }).join("") : `<p class="hint">Nothing fits that budget. Try "Up to $25" or "Any".</p>`;
}

function renderList() {
  const n = state.list.length;
  $("list-n").hidden = !n;
  $("list-n").textContent = n;
  if (!n) {
    $("list-out").innerHTML = `<div class="panel"><h2>Your shortlist is empty</h2><p class="hint">Tap “+ Shortlist” on any tool to compare it side by side here and see what your AI subscriptions add up to each month. Your shortlist is saved in this browser.</p></div>`;
    return;
  }
  const tools = state.list.map(id => byId[id]);
  const mUsd = tools.reduce((s, t) => s + monthly(t), 0);
  const mAud = tools.reduce((s, t) => s + (t.aud_from != null ? t.aud_from : monthly(t) * DATA.rate * DATA.gst), 0);
  const once = tools.filter(t => t.billing === "one-off" && t.from != null);
  const rows = [
    ["Price", t => esc(t.pricing)],
    ["In A$", t => esc(t.aud || (t.from == null ? "—" : "≈ " + money(t.from, "aud") + SUFFIX[t.billing] + " (estimate)"))],
    ["Free tier", t => t.free ? "Yes" + (t.free_note ? ": " + esc(t.free_note) : "") : "No"],
    ["Best for", t => esc(t.best_for)],
    ["Strengths", t => esc(t.strengths)],
    ["Watch out", t => esc(t.watch_out)],
    ["Rating", t => `<b>${overall(t)}</b>/5 · quality ${t.scores.quality} · value ${t.scores.value} · ease ${t.scores.ease} · privacy ${t.scores.privacy}`],
    ["Privacy", t => esc(t.privacy) + ` (data: ${esc(t.region)})`],
    ["Runs on", t => esc(t.platforms)],
    ["Category", t => esc(DATA.categories.find(c => c.id === t.category).name)],
  ];
  $("list-out").innerHTML = `
    <div class="panel">
      <div class="total">
        <div><b>${money(mUsd, "usd")}</b> <span>per month at the cheapest paid tier</span></div>
        <div><b>≈ A$${Math.round(mAud).toLocaleString()}</b> <span>in Australian dollars (published A$ prices where known, otherwise estimated incl. GST)</span></div>
        ${once.length ? `<div><span>plus hardware: ${once.map(t => `${esc(t.name)} ${money(t.from, "usd")}`).join(", ")}</span></div>` : ""}
      </div>
      <p class="hint">Yearly-only plans are divided by 12. Tools you'd use on their free tier still count here; remove them if you won't pay. <button type="button" class="linkbtn" id="clear-list">Clear shortlist</button></p>
    </div>
    <div class="matrix-wrap" style="margin-top:16px"><table class="cmp"><thead><tr><th></th>${tools.map(t => `<th><strong style="font:600 14px var(--font-body);color:var(--fg)">${esc(t.name)}</strong><br>${addBtn(t)}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(([label, f]) => `<tr><td>${label}</td>${tools.map(t => `<td>${f(t)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}

function render() {
  $("cur-usd").setAttribute("aria-pressed", state.cur === "usd");
  $("cur-aud").setAttribute("aria-pressed", state.cur === "aud");
  for (const v of ["browse", "choose", "list"]) {
    $("view-" + v).hidden = state.view !== v;
    $("tab-" + v).setAttribute("aria-selected", state.view === v);
  }
  renderList();
  if (state.view === "browse") renderBrowse();
  if (state.view === "choose") renderChoose();
}
function setCur(c) { state.cur = c; save(); render(); }

document.addEventListener("click", e => {
  const add = e.target.closest("[data-add]");
  if (add) {
    const id = add.dataset.add;
    state.list = inList(id) ? state.list.filter(x => x !== id) : [...state.list, id];
    save(); render(); return;
  }
  const tab = e.target.closest(".tab");
  if (tab) { state.view = tab.dataset.view; render(); return; }
  const need = e.target.closest("[data-need]");
  if (need) { const k = need.dataset.need; state.needs.has(k) ? state.needs.delete(k) : state.needs.add(k); renderChoose(); return; }
  const b = e.target.closest("#budget button");
  if (b) { state.budget = Number(b.dataset.b); renderChoose(); return; }
  if (e.target.id === "clear-list") { state.list = []; save(); render(); }
});
$("picker").addEventListener("submit", e => e.preventDefault());
$("p-priv").addEventListener("change", e => { state.priv = e.target.checked; renderChoose(); });
$("p-easy").addEventListener("change", e => { state.easy = e.target.checked; renderChoose(); });
$("p-eco").addEventListener("change", e => { state.eco = e.target.value; renderChoose(); });

const live = DATA.tools.filter(t => t.status !== "discontinued");
$("meta").innerHTML = `<span>Updated ${esc(DATA.asOf)}</span><span>${DATA.tools.length} tools · ${DATA.categories.length} categories</span><span>${live.filter(t => t.free).length} with a free tier</span><span>US$ · A$ published or ≈ ×${DATA.rate} + GST</span>`;
$("cats").innerHTML = `<button class="chip" type="button" data-cat="all">All</button>` +
  DATA.categories.map(c => `<button class="chip" type="button" data-cat="${c.id}">${esc(c.name)}</button>`).join("");
$("cats").addEventListener("click", e => { const b = e.target.closest(".chip"); if (b) { state.cat = b.dataset.cat; renderBrowse(); } });
$("q").addEventListener("input", e => { state.q = e.target.value.trim(); renderBrowse(); });
$("sort").addEventListener("change", e => { state.sort = e.target.value; renderBrowse(); });
$("free").addEventListener("change", e => { state.free = e.target.checked; renderBrowse(); });
$("picks").addEventListener("change", e => { state.picks = e.target.checked; renderBrowse(); });
$("hide-gone").addEventListener("change", e => { state.hideGone = e.target.checked; renderBrowse(); });
$("cur-usd").addEventListener("click", () => setCur("usd"));
$("cur-aud").addEventListener("click", () => setCur("aud"));
$("foot").innerHTML = `Prices are individual plans in US dollars per month unless marked /yr or "once". A$ prices are published Australian prices where shown; otherwise ≈ estimates at US$1 = A$${DATA.rate} plus 10% GST. App-store prices often differ. Ratings are this guide's judgement: quality counts double, then value, ease and privacy. "Unverified" rows weren't re-checked in this update. AI plans change monthly, so check the maker's site before paying.`;
const hash = location.hash.slice(1);
if (["choose", "list"].includes(hash)) state.view = hash;
else if (DATA.categories.some(c => c.id === hash)) state.cat = hash;
render();
</script>
